name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # Test both the declared language floor and the current patch release.
        go: ["1.27.0", "1.27.x"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go mod tidy -diff
      # The floor is the standard this repository actually holds: every package
      # reports 100.0%, and an uncovered statement is treated as evidence that
      # either the statement or a guard is missing. A floor below that passes on
      # a coverage loss nobody chose.
      # Shuffled because the suite claims independence: nothing here is meant to
      # depend on another test's order or leftovers, and a failure prints the
      # seed to replay it with.
      - name: Test with race detection and complete statement coverage
        run: |
          go test -race -shuffle=on -coverprofile=coverage.out ./...
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ { print $3 }')"
          awk -v coverage="${coverage%\%}" 'BEGIN { exit coverage < 100.0 }'
      - run: go vet ./...

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - run: golangci-lint run ./...
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
      - run: actionlint
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes markdownlint-cli2@0.23.2

  # The committed seed corpus runs as part of `go test`, which only replays
  # inputs someone already found. Every other check in this workflow passed on a
  # Journal.UnmarshalJSON panic that a short fuzz run reached in seconds, so the
  # generator itself has to run on every push.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Fuzz every target
        run: |
          set -euo pipefail
          grep -rl '^func Fuzz' --include='*_test.go' . | while read -r file; do
            package="./$(dirname "$file")"
            grep -o '^func Fuzz[A-Za-z0-9_]*' "$file" | cut -d' ' -f2 | while read -r target; do
              echo "::group::$package $target"
              go test "$package" -run '^$' -fuzz "^${target}\$" -fuzztime=30s
              echo "::endgroup::"
            done
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, quality, docs, fuzz]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
